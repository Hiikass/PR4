<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <form action="" id="form" novalidate>
        <fieldset>
          <legend>Personal Information</legend>

          <label for="name">First Name:</label>
          <input type="text" id="name" name="name" autocomplete="given-name" required />
          <p class="error" id="name-error"></p>

          <label for="surname">Surname:</label>
          <input type="text" id="surname" name="surname" autocomplete="family-name" required />
          <p class="error" id="surname-error"></p>

          <label for="email">Gmail:</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <p class="error" id="email-error"></p>

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <p class="error" id="password-error"></p>

          <div class="checkbox-container">
            <input type="checkbox" id="checkbox" name="checkbox" title="show password" />
            <label for="checkbox">Show/Hide Password</label>
          </div>
        </fieldset>

        <button type="submit" id="submit" disabled>Submit</button>
      </form>
    </main>

    <script src="validation.js"></script>
    <script src="validationPage.js"></script>
    <script src="index.js"></script>
  </body>
</html>
